{% extends 'base.html' %}

{% block title %}Create Order{% endblock %}

{% block content %}
  <h2>Create New Order</h2>
  <form method="post">
      <label for="reservation_id">Link to Reservation (Optional):</label><br>
      <select name="reservation_id" id="reservation_id">
          <option value="">-- Walk-in / No Reservation --</option>
          {% for reservation in reservations %}
              <option value="{{ reservation['id'] }}">
                  {{ reservation['customer_username'] }} @ {{ reservation['reservation_time'].replace('T', ' ') }} ({{ reservation['num_guests'] }} guests) - ID: {{ reservation['id'] }}
              </option>
          {% endfor %}
      </select><br><br>

      <fieldset>
          <legend>Order Items</legend>
          <div id="order-items-container">
              {% for i in range(5) %} {# Loop to create multiple item rows #}
              <div class="order-item-row mb-2">
                  <label for="item_{{ i }}">Item {{ i+1 }}:</label>
                  <select name="item_id_{{ i }}" id="item_{{ i }}">
                      <option value="">-- Select Item --</option>
                      {% for item in sample_items %}
                          <option value="{{ item.id }}">{{ item.name }} (${{ "%.2f"|format(item.price) }})</option>
                      {% endfor %}
                  </select>
                  <label for="quantity_{{ i }}">Quantity:</label>
                  <input type="number" name="quantity_{{ i }}" id="quantity_{{ i }}" min="0" value="0" style="width: 70px; display: inline-block;">
              </div>
              {% endfor %}
          </div>
          </fieldset>
      <br>

     <input type="submit" value="Create Order">
  </form>
  <p><a href="{{ url_for('employee_dashboard') }}" class="button-link mt-2">Back to Dashboard</a></p>
{% endblock %}
